spring.application.name=biblioteca-api

# Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:bibliotecadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (pode ser sobrescrito por variável de ambiente JWT_SECRET)
jwt.secret=${JWT_SECRET:MinhaChaveSuperSecretaComMaisDeTrintaEDoisCaracteresParaJWT2026!}
jwt.expiration=86400000